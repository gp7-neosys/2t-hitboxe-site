<div id="hb-accessibility">
    <button id="hb-access-button" type="button" aria-label="Abrir opções de acessibilidade"
        aria-controls="hb-access-panel" aria-expanded="false" title="Acessibilidade">
        <span class="hb-access-icon" aria-hidden="true">
            <i class="fi fi-rr-universal-access"></i>
        </span>
    </button>

    <section id="hb-access-panel" role="dialog" aria-label="Opções de acessibilidade" aria-hidden="true">

        <div class="hb-head">
            <div class="hb-head-icon">
                <i class="fa fa-universal-access" aria-hidden="true"></i>
            </div>

            <div>
                <h2>Acessibilidade</h2>
                <small>HITBOXE • ACESSIBILIDADE DIGITAL</small>
            </div>

            <button id="hb-close" class="hb-close" type="button" aria-label="Fechar painel">×</button>
        </div>

        <div class="hb-body">

            <h3 class="hb-section-label">
                <i class="fa fa-sliders" aria-hidden="true"></i>
                Personalize sua experiência
            </h3>

            <div class="hb-grid">

                <button class="hb-action" data-option="text-large" aria-pressed="false" type="button">
                    <i class="fa fa-font" aria-hidden="true"></i>
                    <span>Aumentar texto</span>
                </button>

                <button class="hb-action" data-option="text-xlarge" aria-pressed="false" type="button">
                    <i class="fa fa-text-height" aria-hidden="true"></i>
                    <span>Texto extra grande</span>
                </button>

                <button class="hb-action" data-option="contrast" aria-pressed="false" type="button">
                    <i class="fa fa-adjust" aria-hidden="true"></i>
                    <span>Alto contraste</span>
                </button>

                <button class="hb-action" data-option="gray" aria-pressed="false" type="button">
                    <i class="fa fa-tint" aria-hidden="true"></i>
                    <span>Escala de cinza</span>
                </button>

                <button class="hb-action" data-option="readable" aria-pressed="false" type="button">
                    <i class="fa fa-book" aria-hidden="true"></i>
                    <span>Fonte legível</span>
                </button>

                <button class="hb-action" data-option="spacing" aria-pressed="false" type="button">
                    <i class="fa fa-arrows-h" aria-hidden="true"></i>
                    <span>Espaçar letras</span>
                </button>

                <button class="hb-action" data-option="lines" aria-pressed="false" type="button">
                    <i class="fa fa-align-left" aria-hidden="true"></i>
                    <span>Espaçar linhas</span>
                </button>

                <button class="hb-action" data-option="links" aria-pressed="false" type="button">
                    <i class="fa fa-link" aria-hidden="true"></i>
                    <span>Destacar links</span>
                </button>

                <button class="hb-action" data-option="targets" aria-pressed="false" type="button">
                    <i class="fa fa-hand-pointer-o" aria-hidden="true"></i>
                    <span>Cliques maiores</span>
                </button>

                <button class="hb-action" data-option="focus" aria-pressed="false" type="button">
                    <i class="fa fa-crosshairs" aria-hidden="true"></i>
                    <span>Destacar foco</span>
                </button>

                <button class="hb-action" data-option="motion" aria-pressed="false" type="button">
                    <i class="fa fa-pause-circle" aria-hidden="true"></i>
                    <span>Reduzir movimento</span>
                </button>

                <button class="hb-action" data-option="guide" aria-pressed="false" type="button">
                    <i class="fa fa-eye" aria-hidden="true"></i>
                    <span>Guia de leitura</span>
                </button>

            </div>

            <div class="hb-divider"></div>

            <h3 class="hb-section-label">
                <i class="fa fa-eye" aria-hidden="true"></i>
                Percepção de cores
            </h3>

            <div class="hb-cvd" role="group" aria-label="Ajustes de cores">

                <button class="hb-cvd-btn" data-cvd="none" aria-pressed="true" type="button">
                    <span class="hb-dot"></span>
                    Original
                </button>

                <button class="hb-cvd-btn" data-cvd="strong" aria-pressed="false" type="button">
                    <span class="hb-dot"></span>
                    Mais contraste
                </button>

                <button class="hb-cvd-btn" data-cvd="protan" aria-pressed="false" type="button">
                    <span class="hb-dot"></span>
                    Protanopia
                </button>

                <button class="hb-cvd-btn" data-cvd="deutan" aria-pressed="false" type="button">
                    <span class="hb-dot"></span>
                    Deuteranopia
                </button>

                <button class="hb-cvd-btn" data-cvd="tritan" aria-pressed="false" type="button">
                    <span class="hb-dot"></span>
                    Tritanopia
                </button>

            </div>

            <p class="hb-help">
                Ajustes experimentais de cores. A eficácia varia entre pessoas
                e não substitui informações identificadas por texto ou símbolos.
            </p>

            <div class="hb-divider"></div>

            <h3 class="hb-section-label">
                <i class="fa fa-volume-up" aria-hidden="true"></i>
                Leitura por voz
            </h3>

            <div class="hb-tools">

                <button id="hb-speech" class="hb-tool" type="button">
                    <i class="fa fa-play"></i>
                    Ler
                </button>

                <button id="hb-stop-speech" class="hb-tool" type="button">
                    <i class="fa fa-stop"></i>
                    Parar
                </button>

                <button id="hb-reset" class="hb-tool hb-reset" type="button">
                    <i class="fa fa-refresh"></i>
                    Restaurar
                </button>

            </div>

            <p id="hb-status" class="hb-status" role="status" aria-live="polite">
                Use Tab para navegar e Esc para fechar.
            </p>

        </div>
    </section>
</div>

<div id="hb-reading-guide" aria-hidden="true"></div>

    <svg id="hb-cvd-filters" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
            <filter id="hb-protan-filter" color-interpolation-filters="sRGB">
                <feColorMatrix type="matrix"
                    values="
                        0.7 0.3 0 0 0
                        0.3 0.7 0 0 0
                        0 0.15 0.85 0 0
                        0 0 0 1 0
                    "
                />
            </filter>

            <filter id="hb-deutan-filter" color-interpolation-filters="sRGB">
                <feColorMatrix type="matrix"
                    values="
                        0.85 0.15 0 0 0
                        0.25 0.75 0 0 0
                        0 0.12 0.88 0 0
                        0 0 0 1 0
                    "
                />
            </filter>

            <filter id="hb-tritan-filter" color-interpolation-filters="sRGB">
                <feColorMatrix type="matrix"
                    values="
                        0.95 0.05 0 0 0
                        0 0.75 0.25 0 0
                        0 0.3 0.7 0 0
                        0 0 0 1 0
                    "
                />
            </filter>
        </defs>
    </svg>

    </a>

        <div vw-access-button class="active"></div>

        </div>
    </div>
