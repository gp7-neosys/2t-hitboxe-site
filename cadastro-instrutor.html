<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HitBoxe | Cadastrar Instrutor</title>

    <link href="https://fonts.googleapis.com/css?family=Muli:300,400,500,600,700,800,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Oswald:300,400,500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/font-awesome.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #080808;
            color: #fff;
            font-family: Muli, Arial, sans-serif;
        }

        .page {
            min-height: 100vh;
            padding: 40px 20px;
            background: linear-gradient(180deg, #111, #070707);
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 150px;
        }

        .logo img {
            width: 100%;
        }

        .back {
            color: #fff;
            text-decoration: none;
            border: 1px solid #444;
            padding: 10px 16px;
            font-size: 12px;
            font-weight: 800;
            transition: .2s;
        }

        .back:hover {
            border-color: #e30613;
            color: #e30613;
        }

        .box {
            background: #111;
            border: 1px solid #292929;
            padding: 40px;
        }

        .title {
            margin-bottom: 30px;
        }

        .title span {
            color: #e30613;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
        }

        .title h1 {
            font-family: Oswald, sans-serif;
            font-size: 36px;
            text-transform: uppercase;
            margin: 5px 0 10px;
        }

        .title p {
            color: #888;
            font-size: 13px;
            margin: 0;
        }

        .photo-area {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: #171717;
            border: 1px solid #292929;
        }

        .photo-preview {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #222;
            border: 2px solid #e30613;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #777;
            font-size: 28px;
            flex-shrink: 0;
        }

        .photo-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .photo-text strong {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .photo-text span {
            color: #777;
            font-size: 11px;
        }

        .file-button {
            display: inline-block;
            margin-top: 10px;
            background: #e30613;
            padding: 10px 15px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
        }

        #foto {
            display: none;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .field {
            margin-bottom: 2px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            color: #eee;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            height: 45px;
            background: #191919;
            color: #fff;
            border: 1px solid #333;
            padding: 0 13px;
            outline: none;
            border-radius: 2px;
        }

        input:focus,
        select:focus {
            border-color: #e30613;
        }

        select option {
            background: #191919;
        }

        .submit {
            width: 100%;
            height: 50px;
            margin-top: 25px;
            border: 0;
            background: #e30613;
            color: #fff;
            font-weight: 800;
            cursor: pointer;
            transition: .2s;
        }

        .submit:hover {
            background: #fff;
            color: #e30613;
        }

        .message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            text-align: center;
            border: 1px solid #28c76f;
            color: #28c76f;
            background: rgba(40, 199, 111, .08);
            font-size: 13px;
        }

        @media(max-width:700px) {
            .box {
                padding: 25px 18px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .title h1 {
                font-size: 29px;
            }

            .top {
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<main class="page">
    <div class="container">

        <div class="top">
            <div class="logo">
                <img src="img/logo.png" alt="HitBoxe">
            </div>

            <a href="perfil.html" class="back">
                <i class="fa fa-arrow-left"></i> VOLTAR
            </a>
        </div>

        <div class="box">

            <div class="title">
                <span>Gestão da equipe</span>
                <h1>Cadastrar instrutor</h1>
                <p>Preencha os dados do novo profissional da equipe HitBoxe.</p>
            </div>

            <form id="instrutorForm">

                <div class="photo-area">

                    <div class="photo-preview">
                        <img id="fotoPreview" alt="Foto do instrutor">
                        <i id="fotoIcon" class="fa fa-user"></i>
                    </div>

                    <div class="photo-text">
                        <strong>Foto do instrutor</strong>
                        <span>Selecione uma imagem para o perfil.</span>

                        <label for="foto" class="file-button">
                            ESCOLHER FOTO
                        </label>

                        <input type="file" id="foto" accept="image/*">
                    </div>

                </div>

                <div class="grid">

                    <div class="field">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" required>
                    </div>

                    <div class="field">
                        <label for="sobrenome">Sobrenome</label>
                        <input type="text" id="sobrenome" required>
                    </div>

                    <div class="field">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" maxlength="14" required>
                    </div>

                    <div class="field">
                        <label for="nascimento">Data de nascimento</label>
                        <input type="date" id="nascimento" required>
                    </div>

                    <div class="field">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" placeholder="(18) 99999-9999" required>
                    </div>

                    <div class="field">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="field">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" required>
                    </div>

                    <div class="field">
                        <label for="confirmarSenha">Confirmar senha</label>
                        <input type="password" id="confirmarSenha" required>
                    </div>

                    <div class="field">
                        <label for="cep">CEP</label>
                        <input type="text" id="cep" maxlength="9" required>
                    </div>

                    <div class="field">
                        <label for="rua">Rua</label>
                        <input type="text" id="rua" required>
                    </div>

                    <div class="field">
                        <label for="numero">Número</label>
                        <input type="text" id="numero" required>
                    </div>

                    <div class="field">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" required>
                    </div>

                    <div class="field">
                        <label for="estado">Estado</label>
                        <select id="estado" required>
                            <option value="">Selecione</option>
                            <option>AC</option>
                            <option>AL</option>
                            <option>AP</option>
                            <option>AM</option>
                            <option>BA</option>
                            <option>CE</option>
                            <option>DF</option>
                            <option>ES</option>
                            <option>GO</option>
                            <option>MA</option>
                            <option>MT</option>
                            <option>MS</option>
                            <option>MG</option>
                            <option>PA</option>
                            <option>PB</option>
                            <option>PR</option>
                            <option>PE</option>
                            <option>PI</option>
                            <option>RJ</option>
                            <option>RN</option>
                            <option>RS</option>
                            <option>RO</option>
                            <option>RR</option>
                            <option>SC</option>
                            <option>SP</option>
                            <option>SE</option>
                            <option>TO</option>
                        </select>
                    </div>

                    <div class="field full">
                        <label for="especialidade">Especialidade / modalidade</label>
                        <select id="especialidade" required>
                            <option value="">Selecione</option>
                            <option>Instrutor de Boxe</option>
                            <option>Instrutora de Boxe</option>
                            <option>Boxe Iniciante</option>
                            <option>Boxe Intermediário</option>
                            <option>Boxe Avançado</option>
                        </select>
                    </div>

                </div>

                <button class="submit" type="submit">
                    CADASTRAR INSTRUTOR
                </button>

                <div class="message" id="message">
                    Instrutor cadastrado com sucesso!
                </div>

            </form>

        </div>
    </div>
</main>

<script>
(function () {

    const SESSION_KEY = "hitboxSessao";
    const USERS_KEY = "hitboxUsuarios";

    const session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");

    if (!session || session.tipo !== "admin") {
        window.location.href = "Contato.html";
        return;
    }

    const form = document.getElementById("instrutorForm");
    const foto = document.getElementById("foto");
    const fotoPreview = document.getElementById("fotoPreview");
    const fotoIcon = document.getElementById("fotoIcon");

    let fotoBase64 = "";

    foto.addEventListener("change", function () {

        const file = this.files[0];

        if (!file) return;

        const reader = new FileReader();

        reader.onload = function () {

            fotoBase64 = reader.result;

            fotoPreview.src = fotoBase64;
            fotoPreview.style.display = "block";
            fotoIcon.style.display = "none";
        };

        reader.readAsDataURL(file);
    });

    document.getElementById("cpf").addEventListener("input", function () {

        let value = this.value.replace(/\D/g, "");

        value = value.replace(/(\d{3})(\d)/, "$1.$2");
        value = value.replace(/(\d{3})(\d)/, "$1.$2");
        value = value.replace(/(\d{3})(\d{1,2})$/, "$1-$2");

        this.value = value;
    });

    document.getElementById("cep").addEventListener("input", function () {

        let value = this.value.replace(/\D/g, "");

        if (value.length > 5) {
            value = value.substring(0, 5) + "-" + value.substring(5, 8);
        }

        this.value = value;
    });

    form.addEventListener("submit", function (event) {

        event.preventDefault();

        const senha = document.getElementById("senha").value;
        const confirmarSenha = document.getElementById("confirmarSenha").value;

        if (senha !== confirmarSenha) {
            alert("As senhas não coincidem.");
            return;
        }

        const email = document.getElementById("email").value.trim().toLowerCase();

        const users = JSON.parse(
            localStorage.getItem(USERS_KEY) || "[]"
        );

        const emailExists = users.some(
            u => u.email && u.email.toLowerCase() === email
        );

        if (emailExists || email === "admin@hitbox.com") {
            alert("Este e-mail já está cadastrado.");
            return;
        }

        const instructor = {
            id: "instrutor_" + Date.now(),

            tipo: "instrutor",

            nome: document.getElementById("nome").value.trim(),
            sobrenome: document.getElementById("sobrenome").value.trim(),
            cpf: document.getElementById("cpf").value.trim(),
            nascimento: document.getElementById("nascimento").value,
            telefone: document.getElementById("telefone").value.trim(),
            email: email,
            senha: senha,
            cep: document.getElementById("cep").value.trim(),
            rua: document.getElementById("rua").value.trim(),
            numero: document.getElementById("numero").value.trim(),
            cidade: document.getElementById("cidade").value.trim(),
            estado: document.getElementById("estado").value,
            especialidade: document.getElementById("especialidade").value,
            foto: fotoBase64,
            status: "ATIVO",
            dataCadastro: new Date().toLocaleDateString("pt-BR")
        };

        users.push(instructor);

        localStorage.setItem(
            USERS_KEY,
            JSON.stringify(users)
        );

        document.getElementById("message").style.display = "block";

        form.reset();

        fotoBase64 = "";

        fotoPreview.removeAttribute("src");
        fotoPreview.style.display = "none";
        fotoIcon.style.display = "block";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

        setTimeout(function () {
            window.location.href = "perfil.html";
        }, 1500);
    });

})();
</script>

</body>
</html>
